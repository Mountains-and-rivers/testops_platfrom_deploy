# ============================================================
# 全组件批量升级流水线定义（预留）
# ============================================================

pipeline:
  name: "full_stack_upgrade"
  description: "TestOps 全平台组件批量升级流水线（预留）"
  version: "0.1.0"
  status: "reserved"                     # reserved | active | deprecated

  # 全局参数
  global:
    stop_on_failure: true
    auto_backup_before_upgrade: true
    auto_rollback_on_failure: true
    max_parallel_upgrades: 1             # 同时升级的组件数

  # 升级策略
  strategy:
    type: "rolling"                      # rolling | canary | blue_green
    # 滚动升级批次
    batches:
      - batch: 1
        components: ["k8s_cluster_deploy"]
        description: "先升级基础设施（风险最高）"
      - batch: 2
        components: ["prometheus_stack_deploy"]
        description: "升级监控组件"
      - batch: 3
        components: ["wikijs_deploy", "zentao_deploy"]
        description: "并行升级文档和项目平台"
      - batch: 4
        components: ["metersphere_deploy", "ai_test_suite_deploy"]
        description: "最后升级测试工具"

  # 升级后验证
  post_upgrade:
    - action: "health_check"
      description: "全平台健康检查"
    - action: "smoke_test"
      description: "关键功能冒烟测试"
    - action: "generate_report"
      description: "生成升级报告"

  # 回滚计划（升级失败时自动触发）
  rollback_plan:
    enabled: true
    restore_from_backup: true
    max_rollback_time_minutes: 60
