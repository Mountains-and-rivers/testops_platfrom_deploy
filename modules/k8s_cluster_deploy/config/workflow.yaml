workflow:
  name: k8s_cluster_install
  description: K8s 集群安装工作流（8 阶段）
  version: '1.0'
  global:
    stop_on_failure: true
    auto_save_state: true
  stages:
  - name: stage0_pre_check
    description: 环境预检扫描
    order: 0
    enabled: true
    skippable: false
    rollback_supported: false
  - name: stage1_sys_init
    description: 系统标准化初始化（关闭 swap/selinux/防火墙，配置内核参数/limits/NTP）
    order: 1
    enabled: true
    skippable: true
    rollback_supported: true
  - name: stage2_containerd_setup
    description: 容器运行时 containerd 安装配置（cgroup=systemd，镜像加速）
    order: 2
    enabled: true
    skippable: true
    rollback_supported: true
  - name: stage3_kube_components
    description: kubeadm/kubectl/kubelet 安装（YUM 仓库 + 组件安装）
    order: 3
    enabled: true
    skippable: true
    rollback_supported: true
  - name: stage4_master_init
    description: Master 节点集群初始化（kubeadm init, kubectl 配置, join token 生成）
    order: 4
    enabled: true
    skippable: true
    rollback_supported: true
  - name: stage5_node_join
    description: Node 节点加入集群（kubeadm join, 标签设置）
    order: 5
    enabled: true
    skippable: true
    rollback_supported: true
  - name: stage6_cni_deploy
    description: Calico 网络插件部署（VXLAN/IPIP, Pod 网段配置）
    order: 6
    enabled: true
    skippable: true
    rollback_supported: true
  - name: stage7_cluster_verify
    description: 集群部署后健康校验（节点/Pod/DNS/生命周期测试）
    order: 7
    enabled: true
    skippable: true
    rollback_supported: false
