# ============================================================
# K8s 集群节点清单配置
# 请修改 ip / hostname / password 为你实际的机器信息
# ============================================================

node_list:
  # ----- Master 节点 -----
  masters:
    - hostname: "master"         # ← 改成你的 Master 主机名
      ip: "192.168.0.105"                   # ← 改成你的 Master IP
      ssh:
        port: 22
        username: "root"
        password: "123456"              # ← 改成你的 SSH 密码
      role: "control-plane"
      taints: []

  # ----- Worker 节点 -----
  workers:
    - hostname: "node01"           # ← 改成你的 Worker 主机名
      ip: "192.168.0.102"                  # ← 改成你的 Worker IP
      ssh:
        port: 22
        username: "root"
        password: "123456"              # ← 改成你的 SSH 密码
      role: "worker"
      labels:
        node-role.kubernetes.io/worker: ""

    - hostname: "node02"
      ip: "192.168.0.106"                # ← 改成你的 Worker IP（没有就删掉这个节点）
      ssh:
        port: 22
        username: "root"
        password: "123456"
      role: "worker"
      labels:
        node-role.kubernetes.io/worker: ""