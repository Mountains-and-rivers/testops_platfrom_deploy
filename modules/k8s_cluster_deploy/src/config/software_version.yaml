# ============================================================
# K8s 及相关组件目标版本清单
# ============================================================

software_version:
  # ----- Kubernetes 版本 -----
  kubernetes:
    default: "1.36.3"
    available:
      - "1.35.8"
      - "1.36.3"
      - "1.37.0"
    package_repo: "google"

  # ----- etcd 版本 -----
  etcd:
    default: "3.5.16"
    available:
      - "3.5.15"
      - "3.5.16"

  # ----- 容器运行时 -----
  containerd:
    default: "1.7.29"
    available:
      - "1.7.28"
      - "1.7.29"
      - "2.2.6"
      - "2.3.3"

  # ----- 版本兼容性矩阵 -----
  compatibility:
    kubernetes_1_35:
      containerd: ">=1.7.0"
      calico: ">=3.28.0"
    kubernetes_1_36:
      containerd: ">=1.7.0"
      calico: ">=3.29.0"
    kubernetes_1_37:
      containerd: ">=1.7.0"
      calico: ">=3.29.0"

  # ----- runc 版本 -----
  runc:
    default: "1.2.5"
    available:
      - "1.1.15"
      - "1.2.5"

  # ----- CNI 插件版本 -----
  cni_plugins:
    default: "1.6.2"
    available:
      - "1.5.1"
      - "1.6.2"

  # ----- CNI 网络插件 -----
  calico:
    default: "v3.29.1"
    available:
      - "v3.28.2"
      - "v3.29.0"
      - "v3.29.1"

  # ----- CoreDNS 版本 -----
  coredns:
    default: "v1.11.3"

  # ----- pause 镜像版本 -----
  pause:
    default: "3.10"

