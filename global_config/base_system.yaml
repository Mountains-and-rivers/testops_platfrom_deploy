# ============================================================
# 基础操作系统通用配置
# ============================================================
# 适用系统：CentOS 7.9+ / RHEL 8.x+ / Ubuntu 20.04+

base_system:
  # 目标操作系统
  os: "CentOS"
  os_version: "7.9"
  kernel_version_min: "3.10.0"

  # 系统基础参数
  system:
    timezone: "Asia/Shanghai"
    locale: "zh_CN.UTF-8"
    selinux: "disabled"                # enforcing | permissive | disabled
    swap: "disabled"                   # K8s 要求关闭 swap

  # 内核参数优化（适用于服务器/容器场景）
  kernel_params:
    net.ipv4.ip_forward: 1
    net.bridge.bridge-nf-call-iptables: 1
    net.bridge.bridge-nf-call-ip6tables: 1
    vm.swappiness: 0
    vm.max_map_count: 262144
    fs.file-max: 655360
    fs.inotify.max_user_instances: 8192
    fs.inotify.max_user_watches: 1048576

  # 系统资源限制
  limits:
    nofile:
      soft: 65535
      hard: 65535
    nproc:
      soft: 65535
      hard: 65535

  # 必备系统软件包
  required_packages:
    - wget
    - curl
    - vim
    - net-tools
    - telnet
    - lsof
    - ntpdate
    - chrony
    - iproute
    - iputils
    - conntrack
    - socat
    - unzip
    - tar
    - rsync

  # NTP 时间同步服务器
  ntp_servers:
    - ntp.aliyun.com
    - ntp1.aliyun.com
    - time.windows.com

  # DNS 配置
  dns:
    nameservers:
      - 223.5.5.5
      - 223.6.6.6
    search_domains:
      - testops.local
