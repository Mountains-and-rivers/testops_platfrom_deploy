# Java 业务应用 K8s Deployment 模板
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: ${NAMESPACE}
  labels:
    app: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: ${REGISTRY}/testops/java-app:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: "250m", memory: "512Mi" }
          limits:   { cpu: "1",   memory: "1Gi" }
        readinessProbe:
          httpGet: { path: /actuator/health, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: java-app-svc
  namespace: ${NAMESPACE}
spec:
  selector:
    app: java-app
  ports:
  - port: 8080
    targetPort: 8080
