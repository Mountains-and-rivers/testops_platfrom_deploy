# ============================================================
# GitLab CE — Nginx 反向代理配置模板
# 参考: https://docs.gitlab.com/install/self_compiled/#10-nginx
#       官方源码 lib/support/nginx/gitlab (GitLab 19.x)
#
# 由 install_gitlab_source.sh 读取、替换 {{VARIABLE}} 后部署到
#   /usr/local/nginx/conf/conf.d/gitlab.conf (rpm2cpio 方式)
#   /etc/nginx/conf.d/gitlab.conf               (dnf 方式)
#
# 架构: Client → Nginx (:80) → Workhorse (unix socket) → Puma (:3000)
# ============================================================

# ── Workhorse 上游（Unix socket）──
upstream gitlab-workhorse {
    server unix:{{GITLAB_DIR}}/tmp/sockets/gitlab-workhorse.socket fail_timeout=0;
}

# ── WebSocket 升级映射（ActionCable 实时通知）──
map $http_upgrade $connection_upgrade_gitlab {
    default upgrade;
    ''      close;
}

# ── 日志格式：过滤请求中的敏感 token ──
log_format gitlab_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $gitlab_filtered_request_uri $server_protocol" '
                         '$status $body_bytes_sent "$gitlab_filtered_http_referer" '
                         '"$http_user_agent"';

# 逐级过滤 private_token / authenticity_token / feed_token / token
map $request_uri $gitlab_temp_request_uri_1 {
    default $request_uri;
    ~(?i)^(?<start>.*)(?<temp>[\?&]private[\-_]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
}
map $gitlab_temp_request_uri_1 $gitlab_temp_request_uri_2 {
    default $gitlab_temp_request_uri_1;
    ~(?i)^(?<start>.*)(?<temp>[\?&]authenticity[\-_]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
}
map $gitlab_temp_request_uri_2 $gitlab_temp_request_uri_3 {
    default $gitlab_temp_request_uri_2;
    ~(?i)^(?<start>.*)(?<temp>[\?&]feed[\-_]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
}
map $gitlab_temp_request_uri_3 $gitlab_filtered_request_uri {
    default $gitlab_temp_request_uri_3;
    ~(?i)^(?<start>.*)(?<temp>[\?&]token)=[^&]*(?<rest>.*)$ "$start$temp=[FILTERED]$rest";
}
map $http_referer $gitlab_filtered_http_referer {
    default $http_referer;
    ~^(?<temp>.*)\? $temp;
}

server {
    listen {{GITLAB_PORT}};
    listen [::]:{{GITLAB_PORT}};
    server_name {{GITLAB_DOMAIN}};
    server_tokens off;                             # 不暴露 Nginx 版本号

    root {{GITLAB_DIR}}/public;

    # ── 客户端真实 IP（位于代理之后时启用）──
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    # set_real_ip_from YOUR_TRUSTED_PROXY_IP;      # 有前置 LB 时取消注释

    # ── 独立日志 ──
    access_log /var/log/nginx/gitlab_access.log gitlab_access;
    error_log  /var/log/nginx/gitlab_error.log;

    # ── 静态资源（Nginx 直出，不经 Workhorse）──
    location /assets/ {
        gzip_static on;
        expires max;
        add_header Cache-Control public;
    }
    location /uploads/ {
        expires max;
    }

    # ── 所有请求 → Workhorse（鉴权后转发到 Puma）──
    location / {
        client_max_body_size 0;                    # Git push 无大小限制
        gzip off;                                  # Workhorse 自行处理压缩

        proxy_read_timeout      300;               # 长连接（git clone）
        proxy_connect_timeout   300;
        proxy_redirect          off;

        proxy_http_version 1.1;                    # HTTP/1.1 支持 keepalive + WebSocket

        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        $connection_upgrade_gitlab;

        proxy_pass http://gitlab-workhorse;
    }

    # ── 自定义错误页 ──
    error_page 404 /404.html;
    error_page 422 /422.html;
    error_page 500 /500.html;
    error_page 502 /502.html;
    error_page 503 /503.html;
    location ~ ^/(404|422|500|502|503)\.html$ {
        root {{GITLAB_DIR}}/public;
        internal;
    }
}
